# Вставить в server { } основного HTTPS vhost fabrika-tentov.ru сразу после блока location ^~ /captcha/
# (выше location ^~ /static/ и выше location /). Порт proxy_pass подставьте под Gunicorn на сервере.
# Проверка: sudo nginx -t && sudo systemctl reload nginx
#
# Зачем: без этих блоков nginx может отдавать устаревший sitemap.xml/robots.txt из корня docroot или 404.

location = /robots.txt {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /sitemap.xml {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
