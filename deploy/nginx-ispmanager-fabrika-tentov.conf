# Образец для ISPmanager: блоки для вставки в ОБА server {} (порт 80 и 443).
# Перед правкой сделайте бэкап: sudo cp путь/к/конфигу путь/к/конфигу.bak
#
# Если панель пишет «Поле '' имеет недопустимое значение»:
#  — уберите табуляции (только пробелы); не вставляйте целый server{} в поле «доп. директивы»;
#  — для поля «конфигурационный файл nginx» WWW-домена см. nginx-fabrika-tentov.ru.ispmanager-inside-server.conf
#    (только тело одного server{}, без listen/ssl и без трёх отдельных server{} склеек);
#  — либо правка vhost по SSH: sudo nginx -t && sudo systemctl reload nginx.
#
# Важно:
# 1) Удалите или замените старый блок location / { try_files ... index.php } на вариант ниже.
# 2) Блоки location /api/, /admin/, ... должны быть В ТОМ ЖЕ server {}, что и root.
# 3) После правок: sudo nginx -t && sudo systemctl reload nginx

# --- вставить ПЕРЕД location / (или заменить весь location /) ---

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /admin/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /captcha/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /sitemap.xml и /robots.txt — файлы в frontend/dist (generate_public_seo_files при деплое), отдаёт location /.

location ^~ /static/ {
    alias /var/www/kasatkin_da/data/www/fabrika-tentov.ru/backend/staticfiles/;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    expires 7d;
}

location ^~ /media/ {
    alias /var/www/kasatkin_da/data/www/fabrika-tentov.ru/backend/media/;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    expires 7d;
}

# Панель менеджеров /staff/ (admin-ui). Вставить ПЕРЕД location / в ОБОИХ server (80 и 443).
location = /staff {
    return 302 /staff/;
}

location ^~ /staff/ {
    root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
    index index.html;
    try_files $uri $uri/ /staff/index.html;
}

# Хэшированные чанки staff SPA (admin-ui) — как /assets/ витрины.
location ^~ /staff/assets/ {
    root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 365d;
    try_files $uri =404;
}

# index.html — no-cache; /assets/* — immutable (Vite hashed chunks). Вставить ПЕРЕД location /.
location = /index.html {
    root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
    add_header Cache-Control "no-cache, private, must-revalidate" always;
}

location ^~ /assets/ {
    root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 365d;
    try_files $uri =404;
}

