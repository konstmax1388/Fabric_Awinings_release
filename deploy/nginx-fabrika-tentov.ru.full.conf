# Полный production vhost для fabrika-tentov.ru (Django API + SPA витрина + staff SPA).
# ВАЖНО: для витрины нельзя делать location / { try_files … /index.html } — будет soft 404 (200 на мусорные URL).
# Нужен proxy_pass на Gunicorn (блок «Витрина» внизу) + префиксы /assets/, /branding/, … как ниже.
# Проверка: sudo nginx -t && sudo systemctl reload nginx
#
# ISPmanager / панели: если при сохранении «Поле '' имеет недопустимое значение» —
#  1) В поле «Дополнительные директивы nginx» вставляйте только блоки location / настройки
#     БЕЗ обёртки server { } и БЕЗ listen/ssl (их даёт панель). Либо правьте файл по SSH.
#  2) Только пробелы в отступах, не символ Tab.
#  3) Либо замените vhost целиком через SSH (nano/vi), минуя валидатор формы.

server {
    listen 88.85.174.216:80;
    server_name fabrika-tentov.ru www.fabrika-tentov.ru;
    return 301 https://fabrika-tentov.ru$request_uri;
}

server {
    listen 88.85.174.216:443 ssl;
    server_name www.fabrika-tentov.ru;

    ssl_certificate "/var/www/httpd-cert/kasatkin_da/fabrika-tentov.ru_le1.crtca";
    ssl_certificate_key "/var/www/httpd-cert/kasatkin_da/fabrika-tentov.ru_le1.key";
    return 301 https://fabrika-tentov.ru$request_uri;
}

server {
    listen 88.85.174.216:443 ssl;
    server_name fabrika-tentov.ru;

    ssl_certificate "/var/www/httpd-cert/kasatkin_da/fabrika-tentov.ru_le1.crtca";
    ssl_certificate_key "/var/www/httpd-cert/kasatkin_da/fabrika-tentov.ru_le1.key";
    ssl_ciphers EECDH:+AES256:-3DES:RSA+AES:!NULL:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_dhparam /etc/ssl/certs/dhparam4096.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    charset utf-8;
    index index.html;
    disable_symlinks if_not_owner from=$root_path;

    include /etc/nginx/vhosts-includes/*.conf;
    include /etc/nginx/vhosts-resources/fabrika-tentov.ru/*.conf;
    include /etc/nginx/users-resources/kasatkin_da/*.conf;
    include /etc/nginx/modules-includes/phpcomposer/*.conf;

    access_log /var/www/httpd-logs/fabrika-tentov.ru.access.log;
    error_log /var/www/httpd-logs/fabrika-tentov.ru.error.log notice;

    set $root_path /var/www/kasatkin_da/data/www/fabrika-tentov.ru;
    root $root_path;

    client_max_body_size 100m;

    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* (\.env|\.bak|\.sql|\.sqlite|\.sqlite3|\.dump|\.tar|\.gz|\.7z|\.zip)$ {
        deny all;
    }
    location ~* (^|/)\.git {
        deny all;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /captcha/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEO: точные URI выше общих location и выше статики из root — иначе nginx отдаёт
    # устаревшие sitemap.xml/robots.txt из корня сайта или 404 без Django.
    location = /robots.txt {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        alias /var/www/kasatkin_da/data/www/fabrika-tentov.ru/backend/staticfiles/;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        expires 7d;
    }

    # Загрузки из админки (в т.ч. SVG логотип в шапке). Долгий кэш снижает повторные байты (PageSpeed).
    location ^~ /media/ {
        alias /var/www/kasatkin_da/data/www/fabrika-tentov.ru/backend/media/;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        expires 7d;
    }

    location = /staff {
        return 302 /staff/;
    }

    location ^~ /staff/ {
        root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
        index index.html;
        try_files $uri $uri/ /staff/index.html;
    }

    # Витрина — SPA: try_files не должен находить физическую папку под путём SPA (например dist/checkout/
    # от старого public/checkout/) без index.html — иначе 403. Статику кладите в /delivery/, /brand/, …
    #
    # index.html без долгого кэша: иначе после деплоя клиент держит старый HTML со ссылками на удалённые /assets/*.js
    # и падает dynamic import (Failed to fetch dynamically imported module).
    location = /index.html {
        root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, private, must-revalidate" always;
    }

    location ^~ /assets/ {
        root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 365d;
        try_files $uri =404;
    }

    location ^~ /staff/assets/ {
        root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 365d;
        try_files $uri =404;
    }

    # Статика из frontend/public (логотип fallback, иконки оплаты/доставки/МП) — без TTL браузер качает каждый раз.
    location ^~ /branding/ {
        root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        expires 7d;
        try_files $uri =404;
    }

    location ^~ /payments/ {
        root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        expires 7d;
        try_files $uri =404;
    }

    location ^~ /delivery/ {
        root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        expires 7d;
        try_files $uri =404;
    }

    location ^~ /marketplaces/ {
        root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        expires 7d;
        try_files $uri =404;
    }

    # woff2 внутри — с хэшем в имени при сборке нет; параллельно Cache-Control (PageSpeed / Lighthouse).
    location ^~ /fonts/ {
        root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        expires 7d;
        try_files $uri =404;
    }

    # Витрина: HTML от Django — корректный 404 для несуществующих путей (SEO); статика — префиксы выше.
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 75s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
