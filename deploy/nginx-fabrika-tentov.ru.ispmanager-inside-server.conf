# Fabrika Tentov: body for ISPmanager WWW domain nginx include (one server block only).
# The panel usually wraps your text in server { listen ... ssl; server_name ...; ssl_certificate ...; }
# Paste ONLY lines below (no outer server{}, no listen, no ssl_certificate).
#
# ISPmanager: ошибка «Поле '' имеет недопустимое значение»
#   - Не вставляйте файл nginx-fabrika-tentov.ru.full.conf целиком (там несколько server{}).
#   - Только пробелы в отступах, не Tab.
#   - Копируйте из .conf в редакторе (не из Word); при сбое попробуйте убрать все строки, начинающиеся с #.
#   - Если форма не сохраняется: проверьте другие поля на этой же странице (SSL и т.д.) или правьте vhost по SSH.
#
# HTTP_80 and www HTTPS redirects: set in ISPmanager site settings or edit vhosts over SSH
# (see nginx-fabrika-tentov.ru.paste.conf for full three-server file on VPS).
# Paths: change /var/www/kasatkin_da/... if your docroot differs.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

charset utf-8;
index index.html;
disable_symlinks if_not_owner from=$root_path;

include /etc/nginx/vhosts-includes/*.conf;
include /etc/nginx/vhosts-resources/fabrika-tentov.ru/*.conf;
include /etc/nginx/users-resources/kasatkin_da/*.conf;
include /etc/nginx/modules-includes/phpcomposer/*.conf;

access_log /var/www/httpd-logs/fabrika-tentov.ru.access.log;
error_log /var/www/httpd-logs/fabrika-tentov.ru.error.log notice;

set $root_path /var/www/kasatkin_da/data/www/fabrika-tentov.ru;
root $root_path;

client_max_body_size 100m;

location ~ /\.(?!well-known) {
    deny all;
}
location ~* (\.env|\.bak|\.sql|\.sqlite|\.sqlite3|\.dump|\.tar|\.gz|\.7z|\.zip)$ {
    deny all;
}
location ~* (^|/)\.git {
    deny all;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 75s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
}

location ^~ /admin/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /captcha/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SEO: точные URI — всегда Django (views_seo), не файлы из docroot.
location = /robots.txt {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /sitemap.xml {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /static/ {
    alias /var/www/kasatkin_da/data/www/fabrika-tentov.ru/backend/staticfiles/;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    expires 7d;
}

location ^~ /media/ {
    alias /var/www/kasatkin_da/data/www/fabrika-tentov.ru/backend/media/;
    add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    expires 7d;
}

location = /staff {
    return 302 /staff/;
}

location ^~ /staff/ {
    root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
    index index.html;
    try_files $uri $uri/ /staff/index.html;
}

location = /index.html {
    root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache, private, must-revalidate" always;
}

location ^~ /assets/ {
    root /var/www/kasatkin_da/data/www/fabrika-tentov.ru/frontend/dist;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 365d;
    try_files $uri =404;
}

location ^~ /staff/assets/ {
