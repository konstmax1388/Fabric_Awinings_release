# Деплой на VPS после push в main (или вручную: Actions → Deploy VPS → Run workflow).
# Один раз настройте Secrets в репозитории GitHub (Settings → Secrets → Actions):
#   VPS_SSH_HOST      — хост SSH (без user@)
#   VPS_SSH_USER      — пользователь (например kasatkin_da)
#   VPS_SSH_PRIVATE_KEY — полный приватный ключ PEM (включая BEGIN/END)
#   VPS_APP_PATH      — абсолютный путь к корню проекта на сервере
# Имя unit Gunicorn на сервере должно совпадать с примером (fabrika-gunicorn) или поправьте строку systemctl ниже.

name: Deploy VPS

on:
  workflow_dispatch:
  # Раскомментируйте для автодеплоя при каждом push в main:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (git pull, frontend build, django, restart)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_PATH }}"
            git fetch origin main
            git checkout main
            git reset --hard "origin/main"
            export GIT_SHA="$(git rev-parse --short HEAD)"
            export BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            STAFF_TMP="/tmp/fabrika_staff_prev"
            rm -rf "$STAFF_TMP"
            if [ -f frontend/dist/staff/index.html ]; then
              mkdir -p "$STAFF_TMP"
              cp -a frontend/dist/staff/. "$STAFF_TMP"/
            fi
            cd frontend
            if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
            npm run build
            if [ -f "$STAFF_TMP/index.html" ]; then
              mkdir -p dist/staff
              cp -a "$STAFF_TMP"/. dist/staff/
            fi
            cd ../admin-ui
            if [[ -f package-lock.json ]]; then npm ci; else npm install; fi
            npm run build
            cd ..
            rm -rf frontend/dist/staff.new
            mkdir -p frontend/dist/staff.new
            cp -a admin-ui/dist/. frontend/dist/staff.new/
            rm -rf frontend/dist/staff.prev
            if [ -d frontend/dist/staff ]; then mv -T frontend/dist/staff frontend/dist/staff.prev; fi
            mv -T frontend/dist/staff.new frontend/dist/staff
            rm -rf frontend/dist/staff.prev "$STAFF_TMP"
            cd backend
            if [ -f ../.env ]; then set -a; source ../.env; set +a; fi
            source .venv/bin/activate
            pip install -q -r requirements-prod.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            python manage.py generate_public_seo_files
            cd ..
            bash deploy/prune-production-tree.sh --drop-sqlite .
            cd backend
            if [ -f ../.env ]; then set -a; source ../.env; set +a; fi
            source .venv/bin/activate
            python manage.py generate_public_seo_files
            cd ..
            sudo systemctl restart fabrika-gunicorn
            curl -fsS "https://fabrika-tentov.ru/api/health/" >/dev/null
