<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/branding/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- display=swap в URL; media=print + onload — не блокирует первую отрисовку (PageSpeed / LCP). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,700;1,800&display=swap"
      />
    </noscript>
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
  </head>
  <body>
    <script>
      ;(function () {
        var p = location.pathname
        if (p === '/staff' || p === '/staff/') return
        if (p.indexOf('/staff/') !== 0) return
        var inner = p.slice('/staff/'.length)
        if (!inner) return
        if (location.hash && location.hash.length > 1) return
        location.replace('/staff/#/' + inner + location.search)
      })()
    </script>
    <div id="root"></div>
    <noscript>
      <div
        style="padding: 1rem; font-family: system-ui, sans-serif; max-width: 40rem; margin: 0 auto; color: #1a1a1a; background: #fafafa;"
      >
        <p>Для работы каталога нужен JavaScript.</p>
        <nav aria-label="Основные разделы">
          <ul style="margin: 0.75rem 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 0.75rem">
            <li><a href="/">Главная</a></li>
            <li><a href="/catalog">Каталог</a></li>
            <li><a href="/sales">Акции</a></li>
            <li><a href="/portfolio">Портфолио</a></li>
            <li><a href="/blog">Блог</a></li>
            <li><a href="/contacts">Контакты</a></li>
            <li><a href="/reviews">Отзывы</a></li>
            <li><a href="/sitemap.xml">Карта сайта</a></li>
          </ul>
        </nav>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
